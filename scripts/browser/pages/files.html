<!doctype html>
<!-- D8 rows 3 and 4: src="main.lua" runs a file; a module a script
     requires is fetched lazily (and a module it requires in turn);
     data-files puts data where io.open finds it; a require that cannot
     yield (inside a C callback) and a module that does not exist report
     the documented errors. -->
<html lang="en">
<head><meta charset="utf-8"><title>files</title><script src="/lua.js"></script></head>
<body>
<script type="text/lua" src="main.lua" data-files="data/levels.json"></script>
<script type="text/lua">
  -- already loaded: no fetch, same table
  print(require("util") == package.loaded.util, select("#", require("util")))
  -- cannot yield from a C callback: the stock error, with the hint
  local ok, err = pcall(table.sort, {3, 1, 2}, function (a, b) require "late" return a < b end)
  print(ok, err:match("module 'late' not found") ~= nil, err:match("only the resident program can") ~= nil)
  -- a module that is not there: the stock message (path, cpath, and the
  -- root-name cpath line for a dotted name) plus the fetch result
  print(pcall(require, "missing"))
  print(select(2, pcall(require, "pkg.sub")):match("no file '/usr/local/lib/lua/5.4/pkg.so'") ~= nil)
  -- package.loaded[name] = false makes require load the module again, as stock does
  package.loaded.util = false
  local again = require("util")
  print(type(again) == "table", package.loaded.util == again)
</script>
<script type="text/lua" data-files="bad.lua">
  -- require's error texts are stock's, byte for byte: a bad argument, a
  -- module that fails to load (no position prefix: stock raises it from
  -- inside the C searcher), and the full "not found" listing of a dotted
  -- name, with the fetch result lua.js appends stripped off
  print(pcall(require, nil))
  print(pcall(require))
  print(pcall(require, "bad"))
  local ok, msg = pcall(require, "pkg.sub")
  print(ok, (msg:gsub("\n\t%(lua%.js: .-%)$", "")))
</script>
<script type="text/lua" src="nowhere.lua"></script>
</body>
</html>
