# Deep witnesses -- heavy or toolchain-proving runs. Fired two ways:
# MANUALLY (workflow_dispatch), and on every RELEASE TAG (the release
# tier of issue #3: the tag jobs re-run against the tagged commit).
# Tags cut by release.yml are created with GITHUB_TOKEN, whose events
# do not chain-trigger workflows, so release.yml also dispatches this
# workflow explicitly; the on.push.tags trigger covers hand-pushed tags.
#
#   zig-recipe       -> issue #14, inverted since CI moved to the
#                       Makefile defaults: the artifact builds and
#                       passes its witnesses under the README's zig
#                       recipe (zig 0.15.1 = clang 20.1.2 as the
#                       compiler, LLVM's builtins archive named for the
#                       link; port/musl.mk), proving the build is not
#                       tied to one driver.
name: deep-witness
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      job:
        description: "which deep witness to run"
        type: choice
        options: [zig-recipe, all]
        default: zig-recipe

# On a tag push, `inputs` is empty: every job's `if` treats that event
# as "all".

jobs:
  zig-recipe:
    if: github.event_name == 'push' || inputs.job == 'zig-recipe' || inputs.job == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=24.15 <25'  # the standard EH encoding needs 24.15+ (D9)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: zig 0.15.1 (clang 20.1.2), Ubuntu's wasm32 compiler-rt builtins for the link, binaryen
        # No sysroot: the libc is the vendored musl, built here. zig's own
        # compiler-rt stays out of the link (it carries a libm; port/musl.mk).
        run: |
          python3 -m pip install 'ziglang==0.15.1' && npm i --no-save binaryen@132.0.0
          sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev-wasm32
      - name: build with the README's zig recipe
        run: >
          make wasm
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
          WASM_CLANGXX="python3 -m ziglang c++"
          WASM_EXTRA="-Xclang -target-feature -Xclang +exception-handling"
          MUSL_RTLIB=/usr/lib/llvm-18/lib/clang/18/lib/wasi/libclang_rt.builtins-wasm32.a
          WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: host-interface witness
        run: node scripts/interface-witness.mjs lua.wasm
      - name: exception handling stays in one function
        run: node scripts/eh-check.mjs lua.wasm
      - name: full official suite through stock lua.c, Node
        run: node scripts/suite-witness.mjs lua.wasm tests
      - name: differential against native Lua 5.4.8 on musl
        run: >
          make differential
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
          WASM_CLANGXX="python3 -m ziglang c++"
          WASM_EXTRA="-Xclang -target-feature -Xclang +exception-handling"
          MUSL_RTLIB=/usr/lib/llvm-18/lib/clang/18/lib/wasi/libclang_rt.builtins-wasm32.a
          WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: the tarball relinks byte-identical under this driver too, and its example builds with zig cc as the consumer
        run: >
          make sdk-check embed-check EMBED_CC="python3 -m ziglang cc"
          EMBED_RT=/usr/lib/llvm-18/lib/clang/18/lib/wasi/libclang_rt.builtins-wasm32.a
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
          WASM_CLANGXX="python3 -m ziglang c++"
          WASM_EXTRA="-Xclang -target-feature -Xclang +exception-handling"
          MUSL_RTLIB=/usr/lib/llvm-18/lib/clang/18/lib/wasi/libclang_rt.builtins-wasm32.a
          WASM_OPT=node_modules/binaryen/bin/wasm-opt
