# Deep witnesses -- heavy or toolchain-proving runs. Fired two ways:
# MANUALLY (workflow_dispatch), and on every RELEASE TAG (the release
# tier of issue #3: the tag jobs re-run against the tagged commit).
# Tags cut by release.yml are created with GITHUB_TOKEN, whose events
# do not chain-trigger workflows, so release.yml also dispatches this
# workflow explicitly; the on.push.tags trigger covers hand-pushed tags.
#
#   clang20-plain    -> issue #14: the artifact builds and passes its
#                       witnesses under llvm.org's plain clang-20 with
#                       the Makefile DEFAULTS (no zig), proving the
#                       build is not tied to one driver.
name: deep-witness
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      job:
        description: "which deep witness to run"
        type: choice
        options: [clang20-plain, all]
        default: clang20-plain

# On a tag push, `inputs` is empty: every job's `if` treats that event
# as "all".

jobs:
  clang20-plain:
    if: github.event_name == 'push' || inputs.job == 'clang20-plain' || inputs.job == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=24.15 <25'  # the standard EH encoding needs 24.15+ (D9)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: llvm.org clang-20, lld, the wasm32 compiler-rt builtins
        # No sysroot: the libc is the vendored musl, built here.
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 libclang-rt-20-dev-wasm32
      - name: binaryen (wasm-opt) and zig for the native musl oracle only
        run: npm i --no-save binaryen@132.0.0 && python3 -m pip install 'ziglang==0.15.1'
      - name: build with the Makefile DEFAULTS (clang-20, clang++-20, llvm-ar-20)
        run: make wasm MUSL_AR=llvm-ar-20 WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: host-interface witness
        run: node scripts/interface-witness.mjs lua.wasm
      - name: full official suite through stock lua.c, Node
        run: node scripts/suite-witness.mjs lua.wasm tests
      - name: differential against native Lua 5.4.8 on musl
        run: make differential MUSL_AR=llvm-ar-20 WASM_OPT=node_modules/binaryen/bin/wasm-opt
