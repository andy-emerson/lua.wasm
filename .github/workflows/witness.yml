# The witnesses, re-run on every change (AGENTS.md durability: CI-enforced).
#
# native: the deepest witness -- the ltests-instrumented interpreter
#   (checked allocator, internal assertions) runs the full official
#   suite, C-API battery included.
# wasm: the artifact -- lua.wasm in its release form (stripped,
#   wasm-opt) passes the host-interface witness, the full official suite
#   in portable mode through stock lua.c under Node, and the differential
#   witness against native Lua 5.4.8 on musl (byte-identical stdout,
#   stderr, exit status); the libc alone passes its smoke and allocator
#   stress witnesses first.
# browser: the same full suite in Chromium, Firefox and WebKit from a
#   plain page (no COOP/COEP, no SharedArrayBuffer, no workers), and the
#   lua.js witness: one page per D8 row, in the same three engines and
#   from a file:// page.
# provenance: the vendored Lua core is verbatim stock 5.4.8 outside the
#   declared file, and the vendored musl is the signed 1.2.6 release.
#
# Toolchain: zig (pinned 0.15.1 = clang 20.1.2) -- the standard EH
# encoding needs LLVM 20+, which Ubuntu does not package; zig's cc/c++/ar
# build musl and Lua for wasm32-freestanding and bring the wasm32
# compiler-rt builtins. 0.16 (LLVM 21) miscompiles this build (its
# backend rejects the micro-runtime's tag symbols; see src/onelua.c).
# Binaryen (npm) supplies wasm-opt.
name: witness
on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libreadline-dev locales
      - name: pt_BR locale (so the suite's decimal-point tests run, not skip)
        # Best-effort, non-gating: the gate below tolerates the environmental
        # locale skip (upstream does too); this just lets those tests run.
        run: sudo locale-gen pt_BR.UTF-8 pt_BR || true
      - name: build the ltests debug interpreter
        run: make lua-debug
      - name: build the suite's C libraries (unlocks the C-API 'testC' battery)
        # Headers live in src/, so LUA_DIR overrides the stock makefile default.
        run: make -C tests/libs LUA_DIR=../../src
      - name: official suite, full ltests build (C-API battery, zero-skips gate)
        # Full mode (no _port) exercises the tests/libs C modules -- the C-API
        # 'testC' battery port mode cannot reach. Two non-obvious requirements,
        # both witnessed before landing:
        #  * stdin MUST be non-seekable. files.lua's invalid-seek test asserts
        #    io.stdin:seek() fails; that only holds on a pipe -- a redirect or
        #    /dev/null seeks fine (returns 0) and trips the assert. So: ': |'.
        #  * the gate is 'final OK !!!' present AND zero 'testC not active'
        #    skips (the Makefile's stated bar); the locale skip is tolerated.
        run: |
          set -euo pipefail
          cd tests
          : | ../lua-debug all.lua 2>&1 | tee /tmp/suite.log
          grep -q 'final OK !!!' /tmp/suite.log \
            || { echo "::error::suite did not reach 'final OK !!!'"; exit 1; }
          ! grep -q 'testC not active' /tmp/suite.log \
            || { echo "::error::C-API tests skipped (testC not active); tests/libs missing"; exit 1; }

  wasm:
    # Every witness here runs on the release form of the file: what is
    # tested is what ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=24.15 <25'  # the standard EH encoding needs 24.15+ (D9)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: toolchain (zig = clang 20.1.2 and the musl build's compiler; binaryen for wasm-opt)
        run: python3 -m pip install 'ziglang==0.15.1' && npm i --no-save binaryen@132.0.0
      - name: the libc alone -- smoke (printf/strtod exactness, errno, locale, stdin) and allocator stress
        run: >
          make libc-smoke libc-stress
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
      - name: build lua.wasm (release form) and print its size
        run: >
          make wasm
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
          WASM_CLANGXX="python3 -m ziglang c++"
          WASM_EXTRA="-Xclang -target-feature -Xclang +exception-handling"
          WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: host-interface witness (imports, exports, exit, messages, adversarial battery)
        run: node scripts/interface-witness.mjs lua.wasm
      - name: exception handling stays in one function (the interpreter carries no landing pads)
        run: node scripts/eh-check.mjs lua.wasm
      - name: full official suite through stock lua.c (luaw_main), Node
        run: node scripts/suite-witness.mjs lua.wasm tests
      - name: differential against native Lua 5.4.8 on musl (byte-identical stdout, stderr, exit status)
        run: >
          make differential
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
          WASM_CLANGXX="python3 -m ziglang c++"
          WASM_EXTRA="-Xclang -target-feature -Xclang +exception-handling"
          WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: build lua.js (lua.wasm inlined) and print its size
        run: make lua-js WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - uses: actions/upload-artifact@v4
        with:
          name: lua.wasm
          path: |
            lua.wasm
            lua.js

  browser:
    # The full official suite in all three engines, from a plain static
    # page: no COOP/COEP, no SharedArrayBuffer, no workers (asserted:
    # crossOriginIsolated must be false). All three gate. The driver
    # refuses to pass unless the page actually ran on the requested
    # engine (three guards).
    needs: wasm
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false               # one engine's result must not cancel the others
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=24.15 <25'
      - uses: actions/download-artifact@v4
        with:
          name: lua.wasm
      - name: install ${{ matrix.engine }}
        run: npm i --no-save playwright@1.61.1 && npx playwright install --with-deps ${{ matrix.engine }}
      - name: full official suite in a real ${{ matrix.engine }}
        run: node scripts/browser-witness.mjs lua.wasm --engine ${{ matrix.engine }}
      - name: lua.js, one page per D8 row, in a real ${{ matrix.engine }} (and from file://)
        run: node scripts/lua-js-witness.mjs lua.js lua.wasm --engine ${{ matrix.engine }}

  provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: vendored core is verbatim stock 5.4.8 (issue #7)
        # lua.org egress exists on runners but not in every authoring
        # sandbox -- this job is the witness's CI home. The sha256 echo
        # re-states the tarball hash so a pin drift (verify-stock.sh's
        # LUA_SHA256, filled from run 28798839189) is diagnosable from
        # the log.
        run: |
          curl -fsSL -o /tmp/lua.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          echo "lua-5.4.8.tar.gz sha256 (for the LUA_SHA256 pin in verify-stock.sh):"
          sha256sum /tmp/lua.tar.gz
          bash scripts/verify-stock.sh
      - name: vendored C library is verbatim signed musl (third_party/musl)
        # Fetches the release, its detached signature and the project key
        # from musl.libc.org; pins (sha256, key fingerprint) live in the
        # script. gpg/gpgv ship on ubuntu-24.04 runners.
        run: sh scripts/verify-musl.sh
