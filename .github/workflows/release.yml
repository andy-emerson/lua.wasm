# Release cut -- fired MANUALLY (workflow_dispatch; issue #19). Builds
# lua.wasm with the pinned toolchain in its release form and lua.js with
# it inlined, re-verifies the module (host interface + full suite under
# Node + differential), then tags and publishes with both attached. Green witnesses gate the tag: a
# release cannot be cut from a build that didn't just prove itself.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "tag to cut, e.g. v0.1.0"
        type: string
        required: true

permissions:
  contents: write  # create the tag + release and attach the artifact
  actions: write   # the final step dispatches deep-witness.yml; the
                   # workflow_dispatch API refuses without this (issue #40)

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=24.15 <25'  # the standard EH encoding needs 24.15+ (D9)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install 'ziglang==0.15.1' && npm i --no-save binaryen@132.0.0
          sudo apt-get install -y libclang-rt-18-dev-wasm32
      - name: build lua.wasm (pinned toolchain, release form)
        run: >
          make wasm
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
          WASM_CLANGXX="python3 -m ziglang c++"
          WASM_EXTRA="-Xclang -target-feature -Xclang +exception-handling"
          MUSL_RTLIB=/usr/lib/llvm-18/lib/clang/18/lib/wasi/libclang_rt.builtins-wasm32.a
          WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: host-interface witness
        run: node scripts/interface-witness.mjs lua.wasm
      - name: full official suite through stock lua.c, Node
        run: node scripts/suite-witness.mjs lua.wasm tests
      - name: differential against native Lua 5.4.8 on musl
        run: >
          make differential
          WASM_CC="python3 -m ziglang cc" MUSL_AR="python3 -m ziglang ar"
          WASM_CLANGXX="python3 -m ziglang c++"
          WASM_EXTRA="-Xclang -target-feature -Xclang +exception-handling"
          MUSL_RTLIB=/usr/lib/llvm-18/lib/clang/18/lib/wasi/libclang_rt.builtins-wasm32.a
          WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: build lua.js (lua.wasm inlined)
        run: make lua-js WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --target "${{ github.sha }}" \
            --title "lua.wasm ${{ inputs.version }}" \
            --notes "Stock Lua 5.4.8 in a web page. lua.js: one file -- <script src=lua.js></script> then <script type=text/lua> -- with lua.wasm carried inside; print lands on the page, require fetches modules lazily, coroutine.yield() animates per frame, local time is the visitor's, the Lua global reaches the VM from JavaScript, and the page registers functions in Lua.js that Lua calls as js.name(...) with values by copy and promises as tokens (README, doc/lua-js.md). lua.wasm: the module alone, four imports (luaw.write, luaw.now, luaw.read, luaw.call), no WASI, no Emscripten (doc/wasm.md). Standard wasm exception-handling encoding; Chrome >= 137, Firefox >= 131, Safari >= 18.4, Node >= 24.15. Built with zig 0.15.1 (clang 20.1.2) and binaryen 132; the module's witnesses re-run at cut time by this workflow, lua.js's on every change." \
            lua.wasm lua.js
      - name: fire the release-tier deep witnesses against the tag
        # The tag above is created with GITHUB_TOKEN, whose events do not
        # chain-trigger on.push workflows -- dispatch deep-witness (the
        # plain clang-20 build) explicitly so every release carries the
        # heavy-tier evidence (issue #3's release tier).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deep-witness.yml --ref "${{ inputs.version }}" -f job=all
