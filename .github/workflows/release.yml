# Release cut -- fired MANUALLY (workflow_dispatch; issue #19). Builds
# lua.wasm with the Makefile's toolchain in its release form, lua.js
# with it inlined, and the tarball (make sdk) the module is linked
# from; re-verifies the module (host interface + full suite under Node +
# differential) and the tarball (byte-identical relink, the embedding
# example), then tags and publishes with all three attached. Green
# witnesses gate the tag: a release cannot be cut from a build that
# didn't just prove itself.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "tag to cut, e.g. v0.1.0"
        type: string
        required: true

permissions:
  contents: write  # create the tag + release and attach the artifact
  actions: write   # the final step dispatches deep-witness.yml; the
                   # workflow_dispatch API refuses without this (issue #40)

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '>=24.15 <25'  # the standard EH encoding needs 24.15+ (D9)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: llvm.org clang-20, lld-20, the wasm32 compiler-rt builtins
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 libclang-rt-20-dev-wasm32
          clang-20 --version | head -1
      - name: binaryen (wasm-opt), and zig for the native musl oracle only
        run: npm i --no-save binaryen@132.0.0 && python3 -m pip install 'ziglang==0.15.1'
      - name: build lua.wasm (the Makefile defaults, release form)
        run: make wasm MUSL_AR=llvm-ar-20 WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: host-interface witness
        run: node scripts/interface-witness.mjs lua.wasm
      - name: full official suite through stock lua.c, Node
        run: node scripts/suite-witness.mjs lua.wasm tests
      - name: differential against native Lua 5.4.8 on musl
        run: make differential MUSL_AR=llvm-ar-20 WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: build lua.js (lua.wasm inlined)
        run: make lua-js WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: the tarball, named for the tag; lua.wasm relinks from it byte-identical; its example builds and runs
        run: >
          make sdk-check embed-check
          SDK_VERSION="${{ inputs.version }}" MUSL_AR=llvm-ar-20 WASM_OPT=node_modules/binaryen/bin/wasm-opt
      - name: tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --target "${{ github.sha }}" \
            --title "lua.wasm ${{ inputs.version }}" \
            --notes "Stock Lua 5.4.8 in a web page. lua.js: one file -- <script src=lua.js></script> then <script type=text/lua> -- with lua.wasm carried inside; print lands on the page, require fetches modules lazily, coroutine.yield() animates per frame, local time is the visitor's, the Lua global reaches the VM from JavaScript, and the page registers functions in Lua.js that Lua calls as js.name(...) with values by copy and promises as tokens (README, doc/lua-js.md). lua.wasm: the module alone, four imports (luaw.write, luaw.now, luaw.read, luaw.call), no WASI, no Emscripten (doc/wasm.md). lua-wasm-sdk-${{ inputs.version }}.tar.gz: for a program with compiled code of its own -- the archive lua.wasm is linked from, the reactor crt, the headers as a sysroot, the sources, and an example (LINK.md inside). Standard wasm exception-handling encoding; Chrome >= 137, Firefox >= 131, Safari >= 18.4, Node >= 24.15. Built with llvm.org clang-20 and binaryen 132; the module's witnesses re-run at cut time by this workflow, lua.js's on every change." \
            lua.wasm lua.js "lua-wasm-sdk-${{ inputs.version }}.tar.gz"
      - name: fire the release-tier deep witnesses against the tag
        # The tag above is created with GITHUB_TOKEN, whose events do not
        # chain-trigger on.push workflows -- dispatch deep-witness (the
        # zig recipe, the second compiler) explicitly so every release
        # carries the heavy-tier evidence (issue #3's release tier).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deep-witness.yml --ref "${{ inputs.version }}" -f job=all
